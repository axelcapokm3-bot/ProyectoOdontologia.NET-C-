<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OdontoCare - Login</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Plus+Jakarta+Sans:wght@600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "on-primary-fixed-variant": "#004d62",
                        "primary-fixed": "#b9eaff",
                        "secondary-container": "#6df5e1",
                        "on-primary-fixed": "#001f29",
                        "secondary-fixed": "#71f8e4",
                        "on-error-container": "#93000a",
                        "surface-container-low": "#eff4ff",
                        "background": "#f8f9ff",
                        "outline-variant": "#bec8cd",
                        "on-tertiary-fixed": "#131b2e",
                        "surface-container-high": "#dce9ff",
                        "on-secondary-fixed": "#00201c",
                        "surface-container-highest": "#d3e4fe",
                        "on-tertiary-container": "#e7ebff",
                        "outline": "#6f787d",
                        "surface": "#f8f9ff",
                        "on-error": "#ffffff",
                        "secondary-fixed-dim": "#4fdbc8",
                        "tertiary-fixed": "#dae2fd",
                        "on-tertiary-fixed-variant": "#3f465c",
                        "error": "#ba1a1a",
                        "on-primary": "#ffffff",
                        "primary-container": "#0e7490",
                        "surface-tint": "#006781",
                        "on-secondary": "#ffffff",
                        "primary": "#005a71",
                        "surface-variant": "#d3e4fe",
                        "tertiary-container": "#626a81",
                        "tertiary": "#4a5268",
                        "on-primary-container": "#d3f1ff",
                        "on-background": "#0b1c30",
                        "surface-container": "#e5eeff",
                        "tertiary-fixed-dim": "#bec6e0",
                        "inverse-on-surface": "#eaf1ff",
                        "on-surface-variant": "#3f484c",
                        "surface-dim": "#cbdbf5",
                        "on-secondary-container": "#006f64",
                        "inverse-primary": "#81d1f0",
                        "primary-fixed-dim": "#81d1f0",
                        "on-tertiary": "#ffffff",
                        "on-secondary-fixed-variant": "#005048",
                        "surface-container-lowest": "#ffffff",
                        "error-container": "#ffdad6",
                        "inverse-surface": "#213145",
                        "secondary": "#006b5f",
                        "surface-bright": "#f8f9ff",
                        "on-surface": "#0b1c30"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.125rem",
                        "lg": "0.25rem",
                        "xl": "0.5rem",
                        "full": "0.75rem"
                    },
                    "spacing": {
                        "lg": "24px",
                        "xl": "40px",
                        "sm": "8px",
                        "container-margin": "32px",
                        "md": "16px",
                        "gutter": "16px",
                        "base": "4px",
                        "xs": "4px"
                    },
                    "fontFamily": {
                        "headline-md": ["Plus Jakarta Sans"],
                        "body-md": ["Inter"],
                        "headline-lg-mobile": ["Plus Jakarta Sans"],
                        "label-md": ["Inter"],
                        "body-lg": ["Inter"],
                        "body-sm": ["Inter"],
                        "headline-lg": ["Plus Jakarta Sans"],
                        "headline-sm": ["Plus Jakarta Sans"],
                        "display-lg": ["Plus Jakarta Sans"]
                    },
                    "fontSize": {
                        "headline-md": ["24px", { "lineHeight": "32px", "fontWeight": "600" }],
                        "body-md": ["16px", { "lineHeight": "24px", "fontWeight": "400" }],
                        "headline-lg-mobile": ["24px", { "lineHeight": "32px", "fontWeight": "600" }],
                        "label-md": ["12px", { "lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "600" }],
                        "body-lg": ["18px", { "lineHeight": "28px", "fontWeight": "400" }],
                        "body-sm": ["14px", { "lineHeight": "20px", "fontWeight": "400" }],
                        "headline-lg": ["32px", { "lineHeight": "40px", "letterSpacing": "-0.01em", "fontWeight": "600" }],
                        "headline-sm": ["20px", { "lineHeight": "28px", "fontWeight": "600" }],
                        "display-lg": ["48px", { "lineHeight": "56px", "letterSpacing": "-0.02em", "fontWeight": "700" }]

                }
            }
        }
    </script>
    <link rel="stylesheet" href="assets/css/login.css">
</head>
<body class="bg-background min-h-screen flex items-center justify-center p-lg font-body-md text-on-surface antialiased selection:bg-primary-container selection:text-on-primary-container">
    <main class="w-full max-w-[1000px] min-h-[600px] bg-surface-container-lowest border border-outline-variant rounded-xl shadow-[0_10px_32px_rgba(15,23,42,0.08)] flex flex-col md:flex-row overflow-hidden relative z-10">
        <section class="flex-1 bg-surface-container-lowest p-xl flex flex-col items-center justify-center border-b md:border-b-0 md:border-r border-outline-variant relative overflow-hidden">
            <div class="absolute inset-0 opacity-[0.03] pointer-events-none" style="background-image: radial-gradient(circle at 50% 50%, var(--tw-colors-primary) 0%, transparent 70%);"></div>
            <div class="flex flex-col items-center text-center z-10 max-w-sm">
                <div class="w-24 h-24 mb-lg rounded-full bg-surface-container-low flex items-center justify-center anim-logo border border-outline-variant">
                    <span class="material-symbols-outlined text-[48px] text-primary" data-icon="medical_services" data-weight="fill">medical_services</span>
                </div>
                <h1 class="font-headline-lg text-headline-lg text-on-surface mb-md anim-text-1">
                    OdontoCare
                </h1>
                <p class="font-body-lg text-body-lg text-on-surface-variant anim-text-2 leading-relaxed">
                    Bienvenido a su Gestión Clínica
                </p>
            </div>
        </section>
        <section class="w-full md:w-[480px] bg-surface-container-lowest p-xl flex flex-col justify-center anim-form">
            <div class="max-w-[340px] mx-auto w-full">
                <h2 class="font-headline-md text-headline-md text-on-surface mb-xl">
                    Sign In
                </h2>
                <form id="loginForm" class="flex flex-col gap-lg">
                    <div class="flex flex-col gap-xs group">
                        <label class="font-label-md text-label-md text-on-surface-variant group-focus-within:text-primary transition-colors duration-200" for="email">
                            Usuario o Email
                        </label>
                        <input class="h-12 w-full px-md bg-surface-container-lowest border border-outline-variant rounded font-body-md text-body-md text-on-surface focus:border-primary focus:ring-1 focus:ring-primary hover:border-primary/50 outline-none transition-all duration-200 placeholder:text-outline-variant" id="email" name="email" placeholder="Usuario o Email" required type="text"/>
                    </div>
                    <div class="flex flex-col gap-xs group">
                        <label class="font-label-md text-label-md text-on-surface-variant group-focus-within:text-primary transition-colors duration-200" for="password">
                            Password
                        </label>
                        <input class="h-12 w-full px-md bg-surface-container-lowest border border-outline-variant rounded font-body-md text-body-md text-on-surface focus:border-primary focus:ring-1 focus:ring-primary hover:border-primary/50 outline-none transition-all duration-200 placeholder:text-outline-variant" id="password" name="password" placeholder="••••••••" required type="password"/>
                    </div>
                    <div class="flex items-center justify-between mt-xs">
                        <div class="flex items-center gap-sm">
                            <input class="w-4 h-4 rounded border-outline-variant text-primary focus:ring-primary focus:ring-offset-0 bg-surface-container-lowest cursor-pointer hover:border-primary/50 transition-all duration-200" id="remember" type="checkbox"/>
                            <label class="font-body-sm text-body-sm text-on-surface-variant cursor-pointer select-none" for="remember">
                                Remember me
                            </label>
                        </div>
                        <a class="font-label-md text-label-md text-primary hover:text-surface-tint transition-colors duration-200" href="#">
                            ¿Olvidó su contraseña?
                        </a>
                    </div>
                    <button class="h-12 w-full mt-sm bg-primary text-on-primary font-label-md text-label-md rounded flex items-center justify-center hover:bg-surface-tint hover:shadow-md active:scale-[0.98] transition-all duration-200 shadow-sm" type="submit">
                        Iniciar Sesión
                    </button>
                </form>
                <div class="mt-xl text-center">
                    <p class="font-body-sm text-body-sm text-on-surface-variant">
                        ¿Necesita soporte técnico? <a class="text-primary hover:underline hover:text-surface-tint transition-colors duration-200 font-label-md text-label-md ml-xs" href="#">Contactar a IT</a>
                    </p>
                </div>
            </div>
        </section>
    </main>
    <script src="assets/js/config.js"></script>
    <script src="assets/js/api.js"></script>
    <script src="assets/js/login.js"></script>
</body>
</html>
